      <h1>物理筆記</h1>
      <p class="article-intro">用簡單的方式認識生活中常見的物理現象。</p>
      <h2>什麼是物理？</h2>
      <p>物理是一門研究自然現象的科學，像是力、運動、聲音、光和電，都和物理有關。</p>
      <h2>常見的物理概念</h2>
      <ul>
        <li><strong>力：</strong>可以改變物體運動狀態或形狀的作用。</li>
        <li><strong>能量：</strong>讓物體能夠做功或產生變化的能力。</li>
        <li><strong>聲音：</strong>由物體振動產生，並透過介質傳播。</li>
      </ul>
      <div class="example"><strong>生活例子</strong><p>騎腳踏車時，踩踏板會讓車子前進；煞車時，摩擦力會讓車速慢下來。</p></div>
