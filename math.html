      <p class="article-intro">整理常見公式和基本觀念，方便課後複習。</p>
      <h2>函數是什麼？</h2>
      <p>函數可以想成一種對應關係。輸入一個數值，經過規則計算後，就會得到對應的結果。</p>
      <h2>一次函數</h2>
      <p>一次函數常見的形式是：</p>
      <div class="example"><strong>y = ax + b</strong><p>a 代表斜率，b 代表直線與 y 軸的交點。</p></div>
      <h2>簡單例子</h2>
      <p>假設 y = 2x + 1，當 x = 3 時：</p>
      <div class="example"><strong>y = 2 × 3 + 1 = 7</strong><p>所以答案是 7。</p></div>
