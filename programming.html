      <h1>程式設計</h1>
      <p class="article-intro">認識製作網站時最常用到的基本工具。</p>
      <h2>HTML 是什麼？</h2>
      <p>HTML 用來安排網頁的內容和結構，例如標題、段落、圖片和連結。</p>
      <h2>CSS 是什麼？</h2>
      <p>CSS 用來設定網頁外觀，例如顏色、字體、間距和版面配置。</p>
      <h2>JavaScript 是什麼？</h2>
      <p>JavaScript 可以讓網頁具有互動功能，例如按鈕點擊、內容切換和表單檢查。</p>
      <div class="example"><strong>簡單記法</strong><p>HTML 負責內容、CSS 負責外觀、JavaScript 負責互動。</p></div>
